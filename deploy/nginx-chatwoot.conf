server {
    listen 80;
    server_name app-wasup.northeurope.cloudapp.azure.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 3001;
    server_name app-wasup.northeurope.cloudapp.azure.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable upstream compression so sub_filter can rewrite HTML
        proxy_set_header Accept-Encoding "";

        # Inject neutral theme CSS into Typebot builder pages
        sub_filter '</head>' '<style>:root{--chakra-colors-orange-50:#f8fafc!important;--chakra-colors-orange-100:#f1f5f9!important;--chakra-colors-orange-200:#e2e8f0!important;--chakra-colors-orange-300:#cbd5e1!important;--chakra-colors-orange-400:#94a3b8!important;--chakra-colors-orange-500:#64748b!important;--chakra-colors-orange-600:#475569!important;--chakra-colors-orange-700:#334155!important;--chakra-colors-orange-800:#1e293b!important;--chakra-colors-orange-900:#0f172a!important}[data-theme="dark"]:root,.chakra-ui-dark{--chakra-colors-orange-50:#0f172a!important;--chakra-colors-orange-100:#1e293b!important;--chakra-colors-orange-200:#334155!important;--chakra-colors-orange-300:#475569!important;--chakra-colors-orange-400:#64748b!important;--chakra-colors-orange-500:#94a3b8!important;--chakra-colors-orange-600:#cbd5e1!important;--chakra-colors-orange-700:#e2e8f0!important;--chakra-colors-orange-800:#f1f5f9!important;--chakra-colors-orange-900:#f8fafc!important}</style></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
