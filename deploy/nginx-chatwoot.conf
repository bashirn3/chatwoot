server {
    server_name app-wasup.northeurope.cloudapp.azure.com platform.wasup.co;
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;

    # --- WhatsApp Bridge Dashboard ---
    location = /bridge-dashboard {
        alias /opt/chatwoot/public/bridge-dashboard.html;
        default_type text/html;
    }

    # --- Bridge API proxy (injects API key server-side) ---
    location /bridge-api/ {
        proxy_pass http://127.0.0.1:3003/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key change-me;
    }

    ssl_certificate /etc/letsencrypt/live/platform.wasup.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.wasup.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = platform.wasup.co) { return 301 https://$host$request_uri; }
    if ($host = app-wasup.northeurope.cloudapp.azure.com) { return 301 https://$host$request_uri; }
    listen 80;
    server_name app-wasup.northeurope.cloudapp.azure.com platform.wasup.co;
    return 404;
}

# =============================================================
# Typebot Builder (:3001) — proxies all paths, injects UI lockdown
# =============================================================
server {
    listen 3001 ssl;
    server_name app-wasup.northeurope.cloudapp.azure.com platform.wasup.co;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/app-wasup.northeurope.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app-wasup.northeurope.cloudapp.azure.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Chatwoot auth relay — sets session cookie and redirects to editor
    location = /chatwoot-auth {
        add_header Set-Cookie "__Secure-authjs.session-token=$arg_token; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax" always;
        add_header Set-Cookie "authjs.session-token=$arg_token; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax" always;
        add_header Set-Cookie "__Secure-next-auth.session-token=$arg_token; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax" always;
        add_header Set-Cookie "next-auth.session-token=$arg_token; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax" always;
        return 302 $arg_redirect;
    }

    # Catch-all: proxy everything to Typebot builder with UI lockdown injected.
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";

        sub_filter_once on;
        sub_filter '</head>' '<style>
          :root{
            --chakra-colors-orange-50:#f8fafc!important;--chakra-colors-orange-100:#f1f5f9!important;
            --chakra-colors-orange-200:#e2e8f0!important;--chakra-colors-orange-300:#cbd5e1!important;
            --chakra-colors-orange-400:#94a3b8!important;--chakra-colors-orange-500:#64748b!important;
            --chakra-colors-orange-600:#475569!important;--chakra-colors-orange-700:#334155!important;
            --chakra-colors-orange-800:#1e293b!important;--chakra-colors-orange-900:#0f172a!important;
          }
        </style><script>(function(){
          function hide(el){ if(el && el.style.display!=="none") el.style.display="none"; }
          function has(s,sub){ return s && s.indexOf(sub)>=0; }
          function kill(){
            var hdr=document.getElementById("editor-header")||document.querySelector("header")||document.body;
            if(!hdr) return;
            var els=hdr.querySelectorAll("a,button");
            for(var i=0;i<els.length;i++){
              var el=els[i];
              var t=(el.textContent||"").trim();
              var h=(el.getAttribute&&el.getAttribute("href"))||"";
              var tid=(el.getAttribute&&el.getAttribute("data-testid"))||"";
              if(t==="Flow"||t==="Theme"||t==="Settings"||t==="Share"||t==="Results") hide(el);
              if(has(h,"/theme")||has(h,"/share")||has(h,"/results")||has(h,"/settings")) hide(el);
              if(has(tid,"share-tab")||has(tid,"theme-tab")||has(tid,"results-tab")||has(tid,"settings-tab")||has(tid,"share-button")) hide(el);
              if(h==="/typebots"||h==="/workspaces"||has(h,"/register")||has(h,"/signin")||has(h,"/signup")) hide(el);
              if(has(t,"Try Typebot")||has(t,"Upgrade")||has(t,"Pricing")) hide(el);
            }
            var extras=document.querySelectorAll("a");
            for(var j=0;j<extras.length;j++){
              var a=extras[j];
              var eh=(a.getAttribute&&a.getAttribute("href"))||"";
              if(has(eh,"typebot.io")&&!has(eh,"docs")) hide(a);
              if(has(eh,"/pricing")||has(eh,"/upgrade")||has(eh,"/billing")||has(eh,"/templates")) hide(a);
            }
          }
          var mo=new MutationObserver(kill);
          function start(){ kill(); mo.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:["href","class"]}); }
          if(document.readyState==="complete"||document.readyState==="interactive") start();
          else document.addEventListener("DOMContentLoaded",start);
          setInterval(kill,500);
        })();</script></head>';
    }
}

# =============================================================
# Typebot Viewer (:3002) — used by the preview chat / published bots
# =============================================================
server {
    listen 3002 ssl;
    server_name app-wasup.northeurope.cloudapp.azure.com platform.wasup.co;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/app-wasup.northeurope.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app-wasup.northeurope.cloudapp.azure.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
