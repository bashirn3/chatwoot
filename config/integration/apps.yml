######  Attributes Supported by Integration Apps #######
# id: Internal Id for the integrations, used by the hooks
# logo: place the image in /public/dashboard/images/integrations and reference here
# i18n_key: the key under which translations for the integration is placed in en.yml
# action: if integration requires external redirect url
# hook_type: ( account / inbox )
# feature_flag: (string) feature flag to enable/disable the integration
# allow_multiple_hooks: whether multiple hooks can be created for the integration
# settings_json_schema: the json schema used to validate the settings hash (https://json-schema.org/)
# settings_form_schema: the formulate schema used in frontend to render settings form (https://vueformulate.com/)
########################################################
webhooks:
  id: webhook
  logo: webhooks.png
  i18n_key: webhooks
  action: /webhook
  hook_type: account
  allow_multiple_hooks: true
dashboard_apps:
  id: dashboard_apps
  logo: dashboard_apps.png
  i18n_key: dashboard_apps
  hook_type: account
  allow_multiple_hooks: true
openai:
  id: openai
  logo: openai.png
  i18n_key: openai
  action: /openai
  hook_type: account
  allow_multiple_hooks: false
  settings_json_schema:
    {
      'type': 'object',
      'properties':
        {
          'api_key': { 'type': 'string' },
          'label_suggestion': { 'type': 'boolean' },
        },
      'required': ['api_key'],
      'additionalProperties': false,
    }
  settings_form_schema:
    [
      {
        'label': 'API Key',
        'type': 'text',
        'name': 'api_key',
        'validation': 'required',
      },
      {
        'label': 'Show label suggestions',
        'type': 'checkbox',
        'name': 'label_suggestion',
        'validation': '',
      },
    ]
  visible_properties: ['api_key', 'label_suggestion']
linear:
  id: linear
  logo: linear.png
  i18n_key: linear
  action: https://linear.app/oauth/authorize
  hook_type: account
  allow_multiple_hooks: false
notion:
  id: notion
  logo: notion.png
  i18n_key: notion
  hook_type: account
  allow_multiple_hooks: false
slack:
  id: slack
  logo: slack.png
  i18n_key: slack
  action: https://slack.com/oauth/v2/authorize?scope=commands,chat:write,channels:read,channels:manage,channels:join,groups:read,groups:write,im:write,mpim:write,users:read,users:read.email,chat:write.customize,channels:history,groups:history,mpim:history,im:history,files:read,files:write
  hook_type: account
  allow_multiple_hooks: false
dialogflow:
  id: dialogflow
  logo: dialogflow.png
  i18n_key: dialogflow
  action: /dialogflow
  hook_type: inbox
  allow_multiple_hooks: true
  settings_json_schema:
    {
      'type': 'object',
      'properties':
        {
          'project_id': { 'type': 'string' },
          'credentials': { 'type': 'object' },
          'region': { 'type': 'string' },
        },
      'required': ['project_id', 'credentials'],
      'additionalProperties': false,
    }
  settings_form_schema:
    [
      {
        'label': 'Dialogflow Project ID',
        'type': 'text',
        'name': 'project_id',
        'validation': 'required',
        'validationName': 'Project Id',
      },
      {
        'label': 'Dialogflow Project Key File',
        'type': 'textarea',
        'name': 'credentials',
        'validation': 'required|JSON',
        'validationName': 'Credentials',
        'validation-messages':
          { 'JSON': 'Invalid JSON', 'required': 'Credentials is required' },
      },
      {
        'label': 'Dialogflow Region',
        'type': 'select',
        'name': 'region',
        'default': 'global',
        'options': [
          { 'label': 'Global - Default', 'value': 'global' },
          { 'label': 'AS-NE1 - Tokyo, Japan', 'value': 'asia-northeast1' },
          { 'label': 'AU-SE1 - Sydney, Australia', 'value': 'australia-southeast1' },
          { 'label': 'EU-W1 - St. Ghislain, Belgium', 'value': 'europe-west1' },
          { 'label': 'EU-W2 - London, England', 'value': 'europe-west2' },
        ],
      },
    ]
  visible_properties: ['project_id', 'region']
google_translate:
  id: google_translate
  logo: google-translate.png
  i18n_key: google_translate
  action: /google_translate
  hook_type: account
  allow_multiple_hooks: false
  settings_json_schema:
    {
      'type': 'object',
      'properties':
        {
          'project_id': { 'type': 'string' },
          'credentials': { 'type': 'object' },
        },
      'required': ['project_id', 'credentials'],
      'additionalProperties': false,
    }
  settings_form_schema:
    [
      {
        'label': 'Google Cloud Project ID',
        'type': 'text',
        'name': 'project_id',
        'validation': 'required',
        'validationName': 'Project Id',
      },
      {
        'label': 'Google Cloud Project Key File',
        'type': 'textarea',
        'name': 'credentials',
        'validation': 'required|JSON',
        'validationName': 'Credentials',
        'validation-messages':
          { 'JSON': 'Invalid JSON', 'required': 'Credentials is required' },
      },
    ]
  visible_properties: ['project_id']
dyte:
  id: dyte
  logo: dyte.png
  i18n_key: dyte
  action: /dyte
  hook_type: account
  allow_multiple_hooks: false
  settings_json_schema:
    {
      'type': 'object',
      'properties':
        {
          'api_key': { 'type': 'string' },
          'organization_id': { 'type': 'string' },
        },
      'required': ['api_key', 'organization_id'],
      'additionalProperties': false,
    }
  settings_form_schema:
    [
      {
        'label': 'Organization ID',
        'type': 'text',
        'name': 'organization_id',
        'validation': 'required',
      },
      {
        'label': 'API Key',
        'type': 'text',
        'name': 'api_key',
        'validation': 'required',
      },
    ]
  visible_properties: ['organization_id']

shopify:
  id: shopify
  logo: shopify.png
  i18n_key: shopify
  hook_type: account
  allow_multiple_hooks: false

router:
  id: router
  logo: bot-router.png
  i18n_key: router
  action: /router
  hook_type: inbox
  allow_multiple_hooks: true
  settings_json_schema:
    {
      'type': 'object',
      'properties':
        {
          'router_mode': { 'type': 'string', 'enum': ['auto', 'typebot_only', 'rag_only'] },
          'typebot_url': { 'type': 'string' },
          'public_id': { 'type': 'string' },
          'api_token': { 'type': 'string' },
          'llm_provider': { 'type': 'string', 'enum': ['openai', 'anthropic'] },
          'llm_api_key': { 'type': 'string' },
          'llm_model': { 'type': 'string' },
          'system_prompt': { 'type': 'string' },
          'trigger_keywords': { 'type': 'string' },
          'confidence_threshold': { 'type': 'number' },
        },
      'required': ['typebot_url', 'public_id'],
      'additionalProperties': false,
    }
  settings_form_schema:
    [
      {
        'label': 'Routing Mode',
        'type': 'select',
        'name': 'router_mode',
        'default': 'auto',
        'options': [
          { 'label': 'Auto — RAG for Q&A, Typebot for workflows', 'value': 'auto' },
          { 'label': 'Typebot Only — all messages to Typebot', 'value': 'typebot_only' },
          { 'label': 'RAG Only — all messages to knowledge base', 'value': 'rag_only' },
        ],
        'help': 'How incoming messages are routed between the AI knowledge base and Typebot flows',
      },
      {
        'label': 'Typebot Server URL',
        'type': 'text',
        'name': 'typebot_url',
        'validation': 'required',
        'validationName': 'Server URL',
        'help': 'The URL of your self-hosted Typebot instance (e.g., https://typebot.example.com)',
      },
      {
        'label': 'Typebot Public ID',
        'type': 'text',
        'name': 'public_id',
        'validation': 'required',
        'validationName': 'Public ID',
        'help': 'The public ID of the Typebot you want to connect',
      },
      {
        'label': 'Typebot API Token',
        'type': 'text',
        'name': 'api_token',
        'help': 'API token for authenticated requests to your Typebot instance',
      },
      {
        'label': 'Trigger Keywords (comma-separated)',
        'type': 'text',
        'name': 'trigger_keywords',
        'help': 'Messages starting with these words go to Typebot instead of RAG (e.g., "menu, help, start")',
      },
      {
        'label': 'LLM Provider',
        'type': 'select',
        'name': 'llm_provider',
        'default': 'openai',
        'options': [
          { 'label': 'OpenAI', 'value': 'openai' },
          { 'label': 'Anthropic', 'value': 'anthropic' },
        ],
        'help': 'Provider for the RAG knowledge base AI',
      },
      {
        'label': 'LLM API Key',
        'type': 'text',
        'name': 'llm_api_key',
        'help': 'API key for your LLM provider (required for RAG mode)',
      },
      {
        'label': 'LLM Model',
        'type': 'text',
        'name': 'llm_model',
        'help': 'Model name (e.g., gpt-4.1-mini, claude-sonnet-4-20250514). Defaults to gpt-4.1-mini',
      },
      {
        'label': 'System Prompt',
        'type': 'textarea',
        'name': 'system_prompt',
        'help': 'Custom instructions for the RAG AI assistant. Leave blank for default.',
      },
      {
        'label': 'Confidence Threshold',
        'type': 'number',
        'name': 'confidence_threshold',
        'help': 'Minimum confidence (0.0-1.0) for the RAG bot to respond. Below this, conversation is handed off to a human. Default: 0.6',
      },
    ]
  visible_properties: ['router_mode', 'typebot_url', 'public_id', 'llm_provider']

google_drive:
  id: google_drive
  logo: google-drive.png
  i18n_key: google_drive
  hook_type: account
  allow_multiple_hooks: false

leadsquared:
  id: leadsquared
  feature_flag: crm_integration
  logo: leadsquared.png
  i18n_key: leadsquared
  action: /leadsquared
  hook_type: account
  allow_multiple_hooks: false
  settings_json_schema:
    {
      'type': 'object',
      'properties':
        {
          'access_key': { 'type': 'string' },
          'secret_key': { 'type': 'string' },
          'endpoint_url': { 'type': 'string' },
          'app_url': { 'type': 'string' },
          'timezone': { 'type': 'string' },
          'enable_conversation_activity': { 'type': 'boolean' },
          'enable_transcript_activity': { 'type': 'boolean' },
          'conversation_activity_score': { 'type': 'string' },
          'transcript_activity_score': { 'type': 'string' },
          'conversation_activity_code': { 'type': 'integer' },
          'transcript_activity_code': { 'type': 'integer' },
        },
      'required': ['access_key', 'secret_key'],
      'additionalProperties': false,
    }
  settings_form_schema:
    [
      {
        'label': 'Access Key',
        'type': 'text',
        'name': 'access_key',
        'validation': 'required',
      },
      {
        'label': 'Secret Key',
        'type': 'text',
        'name': 'secret_key',
        'validation': 'required',
      },
      {
        'label': 'Push Conversation Activity',
        'type': 'checkbox',
        'name': 'enable_conversation_activity',
        'help': 'Enable this option to push an activity when a conversation is created',
      },
      {
        'label': 'Conversation Activity Score',
        'type': 'number',
        'name': 'conversation_activity_score',
        'help': 'Score to assign to the conversation created activity, default is 0',
      },
      {
        'label': 'Push Transcript Activity',
        'type': 'checkbox',
        'name': 'enable_transcript_activity',
        'help': 'Enable this option to push an activity when a transcript is created',
      },
      {
        'label': 'Transcript Activity Score',
        'type': 'number',
        'name': 'transcript_activity_score',
        'help': 'Score to assign to the conversation transcript activity, default is 0',
      },
    ]
  visible_properties:
    [
      'access_key',
      'endpoint_url',
      'enable_conversation_activity',
      'enable_transcript_activity',
      'conversation_activity_score',
      'transcript_activity_score',
    ]
