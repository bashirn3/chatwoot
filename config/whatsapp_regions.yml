# WhatsApp bridge — multi-region fleet registry.
#
# This file is COMMITTED and contains NO secrets. All URLs and API keys come
# from env vars (see .env.example). Regions whose env vars are unset at boot
# are silently skipped from the active set — so rolling out regions is just
# a matter of adding env vars and restarting the app.
#
# Shape of each entry:
#   url       (string, from env)  — base URL of the regional framework
#   api_key   (string, from env)  — X-API-Key header for the regional framework
#   country   (string, ISO-3166-1 alpha-2) — country this region primarily serves
#   label     (string)            — display name shown in the UI
#   lat/lng   (float)             — datacentre coordinates for the country map
#   active    (bool)              — offered as a choice in the picker
#   legacy    (bool, optional)    — hidden from UI but kept routable for old instances
#
# Ordering in this file has no functional meaning.

legacy:
  url: <%= ENV.fetch('WHATSAPP_BRIDGE_URL', nil) %>
  api_key: <%= ENV.fetch('WHATSAPP_BRIDGE_API_KEY', nil) %>
  active: false
  legacy: true
  label: Legacy single-region

